<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.7)),
    url('bg.png') no-repeat center/cover fixed;
  font-family:inter,system-ui,arial;
  color:#fff;
}

.box{
  text-align:center;
  padding:40px 50px;
  backdrop-filter:blur(12px);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  max-width:90%;
}

.box img{
  width:100px;
  margin:0 auto 20px;
  opacity:.9;
}

h1{
  margin:0;
  font-size:90px;
  font-weight:700;
  letter-spacing:-2px;
}

p{
  margin:10px 0 25px;
  font-size:18px;
  color:rgba(255,255,255,.75);
}

a{
  display:inline-block;
  padding:10px 20px;
  border-radius:999px;
  background:#fff;
  color:#000;
  text-decoration:none;
  font-weight:500;
  transition:.2s;
}

a:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}
</style>
</head>

<body>
  <div class="box">
    <img src="top.png" alt="">
    <h1>404</h1>
    <p>page not found</p>
    <a href="/">go home</a>
  </div>
</body>
</html>
