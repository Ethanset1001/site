<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spread</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .websim-credit {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 4px;
        }
        .websim-credit a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }
        .websim-credit a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://tehthing.on.websim.com" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; webcam; microphone"
        allowfullscreen>
    </iframe>

    <div class="websim-credit">
        <a href="https://websim.com/@weeop/idkbro">This is a port of a Websim project</a>
    </div>

</body>
</html>
