<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spread</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .credit-popup {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 1000;
            background-color: #000;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 400px;
        }
        .credit-popup-text {
            color: #fff;
            font-size: 14px;
            font-family: Arial, sans-serif;
            line-height: 1.4;
        }
        .credit-popup-text a {
            color: #4a9eff;
            text-decoration: none;
        }
        .credit-popup-text a:hover {
            text-decoration: underline;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .close-btn:hover {
            color: #ccc;
        }
        .credit-popup.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://tehthing.on.websim.com" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; webcam; microphone"
        allowfullscreen>
    </iframe>

    <div class="credit-popup" id="creditPopup">
        <div class="credit-popup-text">
            uh i ported this project real site is https://websim.com/@weeop/idkbro
        </div>
        <button class="close-btn" onclick="document.getElementById('creditPopup').classList.add('hidden')">✕</button>
    </div>

    <script>
        // Optional: Close popup when Escape key is pressed
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                document.getElementById('creditPopup').classList.add('hidden');
            }
        });
    </script>

</body>
</html>
